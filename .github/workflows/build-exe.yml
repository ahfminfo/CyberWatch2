name: Build CyberWatch Desktop PyQt5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5==5.15.10 pandas openpyxl pyinstaller
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onedir --windowed --name "CyberWatch" `
          --add-data "database.py;." `
          --collect-all PyQt5 `
          --hidden-import PyQt5 `
          --hidden-import PyQt5.QtCore `
          --hidden-import PyQt5.QtGui `
          --hidden-import PyQt5.QtWidgets `
          --hidden-import pandas `
          --hidden-import openpyxl `
          --hidden-import sqlite3 `
          --hidden-import numpy `
          main.py
    
    - name: Verify build
      run: |
        if (Test-Path "dist/CyberWatch/CyberWatch.exe") {
          Write-Host "✅ Build successful!"
          $size = (Get-Item "dist/CyberWatch/CyberWatch.exe").Length / 1MB
          Write-Host "📦 EXE Size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Host "❌ Build failed!"
          exit 1
        }
    
    - name: Compress output
      run: |
        Compress-Archive -Path "dist/CyberWatch/*" -DestinationPath "CyberWatch-Final.zip"
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: CyberWatch-Final
        path: CyberWatch-Final.zip
        retention-days: 30
