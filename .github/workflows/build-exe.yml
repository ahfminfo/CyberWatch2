name: Build CyberWatch Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6==6.6.1 pandas openpyxl pyinstaller
    
    - name: Build EXE with PyInstaller (onedir mode)
      run: |
        pyinstaller --onedir --windowed --name "CyberWatch" `
          --add-data "database.py;." `
          --collect-all PyQt6 `
          --collect-submodules PyQt6 `
          --collect-binaries PyQt6 `
          --collect-data PyQt6 `
          --hidden-import PyQt6 `
          --hidden-import PyQt6.QtCore `
          --hidden-import PyQt6.QtGui `
          --hidden-import PyQt6.QtWidgets `
          --hidden-import pandas `
          --hidden-import openpyxl `
          --hidden-import sqlite3 `
          --hidden-import numpy `
          main.py
    
    - name: Compress output folder
      run: |
        Compress-Archive -Path "dist/CyberWatch/*" -DestinationPath "CyberWatch-Desktop.zip"
    
    - name: Upload EXE folder
      uses: actions/upload-artifact@v4
      with:
        name: CyberWatch-Desktop-v3
        path: CyberWatch-Desktop.zip
        retention-days: 30
