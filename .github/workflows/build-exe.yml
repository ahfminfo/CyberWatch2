name: Build CyberWatch Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download Python Embeddable
      run: |
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile "python-embed.zip"
        Expand-Archive -Path "python-embed.zip" -DestinationPath "CyberWatch-Portable/python"
        Remove-Item "python-embed.zip"
    
    - name: Enable site packages in Python
      run: |
        $pthFile = Get-ChildItem "CyberWatch-Portable/python/python*._pth" | Select-Object -First 1
        (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
    
    - name: Install pip
      run: |
        Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
        CyberWatch-Portable/python/python.exe get-pip.py --no-warn-script-location
        Remove-Item "get-pip.py"
    
    - name: Install packages
      run: |
        CyberWatch-Portable/python/python.exe -m pip install streamlit pandas openpyxl --no-warn-script-location
    
    - name: Copy application files
      run: |
        Copy-Item "app.py" -Destination "CyberWatch-Portable/"
        Copy-Item "database.py" -Destination "CyberWatch-Portable/"
        Copy-Item ".streamlit" -Destination "CyberWatch-Portable/" -Recurse
    
    - name: Create launcher BAT file
      run: |
        $batContent = @'
        @echo off
        chcp 65001 > nul
        title CyberWatch - سامانه هوشمند
        color 0B
        cls
        echo.
        echo  ================================================
        echo    CyberWatch - در حال راه اندازی ...
        echo  ================================================
        echo.
        echo  لطفا صبر کنید ...
        echo  مرورگر خودکار باز خواهد شد
        echo.
        echo  برای توقف: این پنجره را ببندید
        echo  ================================================
        echo.
        
        cd /d "%~dp0"
        
        start "" "http://127.0.0.1:8501"
        
        python\python.exe -m streamlit run app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true --browser.gatherUsageStats false
        
        pause
        '@
        Set-Content -Path "CyberWatch-Portable/CyberWatch.bat" -Value $batContent -Encoding UTF8
    
    - name: Create README
      run: |
        $readme = @'
        ===================================
           CyberWatch - راهنمای اجرا
        ===================================
        
        نحوه اجرا:
        1. روی CyberWatch.bat دابل کلیک کنید
        2. صبر کنید (5-10 ثانیه)
        3. مرورگر خودکار باز می شود
        4. فایل اکسل را بارگذاری کنید
        
        نکات:
        - نیازی به نصب Python نیست
        - همه چیز داخل پوشه python است
        - دیتابیس در همین پوشه ذخیره می شود
        
        برای انتقال به سیستم دیگر:
        - کل این پوشه را کپی کنید
        - در سیستم مقصد، CyberWatch.bat را اجرا کنید
        ===================================
        '@
        Set-Content -Path "CyberWatch-Portable/راهنما.txt" -Value $readme -Encoding UTF8
    
    - name: Compress to ZIP
      run: |
        Compress-Archive -Path "CyberWatch-Portable/*" -DestinationPath "CyberWatch-Portable.zip"
    
    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: CyberWatch-Portable
        path: CyberWatch-Portable.zip
        retention-days: 30
