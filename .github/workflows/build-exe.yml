name: Build سامانه نظارت v11.0 - Setup Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ═══════════════════════════════════════════════
    # مرحله ۱: Checkout
    # ═══════════════════════════════════════════════
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ═══════════════════════════════════════════════
    # مرحله ۲: Setup Python
    # ═══════════════════════════════════════════════
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # ═══════════════════════════════════════════════
    # مرحله ۳: Cache
    # ═══════════════════════════════════════════════
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-v11-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v11-
          ${{ runner.os }}-pip-
    
    # ═══════════════════════════════════════════════
    # مرحله ۴: نصب Dependencies
    # ═══════════════════════════════════════════════
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5==5.15.10 pandas openpyxl pyinstaller Pillow
    
    # ═══════════════════════════════════════════════
    # مرحله ۵: نصب Inno Setup (با Chocolatey)
    # ═══════════════════════════════════════════════
    - name: Install Inno Setup via Chocolatey
      run: |
        Write-Host "📦 Installing Inno Setup via Chocolatey..."
        choco install innosetup -y --no-progress
        
        Write-Host "✅ Inno Setup installed"
        
        # چک نصب
        $innoPath = "C:\Program Files (x86)\Inno Setup 6"
        if (Test-Path "$innoPath\ISCC.exe") {
          Write-Host "✅ ISCC.exe found at: $innoPath\ISCC.exe"
          & "$innoPath\ISCC.exe" /? | Select-Object -First 3
        } else {
          # مسیر جایگزین
          $possiblePaths = @(
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 5\ISCC.exe"
          )
          
          $found = $false
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "✅ Found at: $path"
              $found = $true
              break
            }
          }
          
          if (-not $found) {
            Write-Host "❌ ISCC.exe not found in any location!"
            Write-Host "Searching for ISCC.exe..."
            Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
        }
    
    # ═══════════════════════════════════════════════
    # مرحله ۶: ساخت آیکون
    # ═══════════════════════════════════════════════
    - name: Generate Icon
      run: |
        Write-Host "🎨 Creating application icon..."
        
        $iconScript = @'
        from PIL import Image, ImageDraw
        
        sizes = [16, 32, 48, 64, 128, 256]
        images = []
        
        for size in sizes:
            img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
            draw = ImageDraw.Draw(img)
            
            # دایره پس‌زمینه آبی
            margin = size // 16
            draw.ellipse(
                [margin, margin, size - margin, size - margin],
                fill=(37, 99, 235, 255),
                outline=(96, 165, 250, 255),
                width=max(1, size // 32)
            )
            
            # سپر سفید
            shield_margin = size // 4
            shield_top = shield_margin
            shield_bottom = size - shield_margin
            shield_left = shield_margin + size // 12
            shield_right = size - shield_margin - size // 12
            shield_mid_x = size // 2
            
            shield_points = [
                (shield_left, shield_top + size // 12),
                (shield_right, shield_top + size // 12),
                (shield_right, shield_top + (shield_bottom - shield_top) * 2 // 3),
                (shield_mid_x, shield_bottom),
                (shield_left, shield_top + (shield_bottom - shield_top) * 2 // 3),
            ]
            
            draw.polygon(shield_points, fill=(255, 255, 255, 240))
            
            # علامت تیک آبی
            check_size = size // 4
            check_x = shield_mid_x - check_size // 2
            check_y = size // 2 - check_size // 4
            
            check_points = [
                (check_x, check_y + check_size // 3),
                (check_x + check_size // 3, check_y + check_size * 2 // 3),
                (check_x + check_size, check_y),
            ]
            
            draw.line(
                check_points,
                fill=(37, 99, 235, 255),
                width=max(2, size // 24),
                joint="curve"
            )
            
            images.append(img)
        
        images[0].save(
            'icon.ico',
            format='ICO',
            sizes=[(s, s) for s in sizes],
            append_images=images[1:]
        )
        
        print("Icon created successfully")
        '@
        
        $iconScript | Out-File -FilePath "create_icon.py" -Encoding UTF8
        python create_icon.py
        
        if (Test-Path "icon.ico") {
          $iconSize = (Get-Item "icon.ico").Length / 1KB
          Write-Host "✅ Icon: $([math]::Round($iconSize, 2)) KB"
        } else {
          Write-Host "❌ Icon creation failed"
          exit 1
        }
    
    # ═══════════════════════════════════════════════
    # مرحله ۷: نمایش ساختار
    # ═══════════════════════════════════════════════
    - name: Show file structure
      run: |
        Write-Host "📁 Repository files:"
        Get-ChildItem -Path . -File | Format-Table Name, Length
    
    # ═══════════════════════════════════════════════
    # مرحله ۸: Build EXE
    # ═══════════════════════════════════════════════
    - name: Build EXE with PyInstaller
      run: |
        Write-Host "🔨 Building EXE..."
        
        pyinstaller --onedir --windowed --name "SamanehNezarat" `
          --icon "icon.ico" `
          --add-data "database.py;." `
          --add-data "icon.ico;." `
          --collect-all PyQt5 `
          --hidden-import PyQt5 `
          --hidden-import PyQt5.QtCore `
          --hidden-import PyQt5.QtGui `
          --hidden-import PyQt5.QtWidgets `
          --hidden-import pandas `
          --hidden-import openpyxl `
          --hidden-import sqlite3 `
          --hidden-import numpy `
          --hidden-import re `
          --hidden-import shutil `
          --hidden-import datetime `
          --noconfirm `
          main.py
    
    # ═══════════════════════════════════════════════
    # مرحله ۹: تأیید Build
    # ═══════════════════════════════════════════════
    - name: Verify EXE build
      run: |
        if (Test-Path "dist/SamanehNezarat/SamanehNezarat.exe") {
          Write-Host "✅ EXE Build successful!"
          $exe = Get-Item "dist/SamanehNezarat/SamanehNezarat.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "📦 EXE Size: $sizeMB MB"
        } else {
          Write-Host "❌ EXE Build failed!"
          exit 1
        }
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۰: ساخت README
    # ═══════════════════════════════════════════════
    - name: Create README
      run: |
        $readme = @"
        ================================================
        Samaneh Nezarat v11.0
        ================================================
        
        Installation:
        1. Run SamanehNezarat-Setup-v11.0.exe
        2. Follow the installation wizard
        3. Desktop icon will be created
        
        First Run:
        - You must load an Excel database file
        - Without dataset, the app won't run
        
        Data Location:
        C:\ProgramData\SamanehNezarat\
        
        ================================================
        "@
        $readme | Out-File -FilePath "README.txt" -Encoding UTF8
        Write-Host "✅ README created"
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۱: Build Setup
    # ═══════════════════════════════════════════════
    - name: Build Setup Installer with Inno Setup
      run: |
        Write-Host "🔨 Building Setup Installer..."
        
        # پیدا کردن ISCC
        $isccPath = ""
        $possiblePaths = @(
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
          "C:\Program Files\Inno Setup 6\ISCC.exe"
        )
        
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            $isccPath = $path
            break
          }
        }
        
        if ($isccPath -eq "") {
          Write-Host "❌ ISCC.exe not found!"
          exit 1
        }
        
        Write-Host "Using: $isccPath"
        
        & $isccPath "installer.iss"
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Setup Installer created!"
          Get-ChildItem -Path "." -Filter "*.exe" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "📦 $($_.Name): $sizeMB MB"
          }
        } else {
          Write-Host "❌ Setup build failed!"
          exit 1
        }
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۲: تأیید Setup
    # ═══════════════════════════════════════════════
    - name: Verify Setup file
      run: |
        $setupFile = "SamanehNezarat-Setup-v11.0.exe"
        
        if (Test-Path $setupFile) {
          $setup = Get-Item $setupFile
          $sizeMB = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "✅ Setup ready: $setupFile ($sizeMB MB)"
        } else {
          Write-Host "❌ Setup file not found!"
          Get-ChildItem -Path . -Filter "*.exe" | Format-Table
          exit 1
        }
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۳: آپلود Setup
    # ═══════════════════════════════════════════════
    - name: Upload Setup Installer
      uses: actions/upload-artifact@v4
      with:
        name: SamanehNezarat-Setup-v11.0
        path: SamanehNezarat-Setup-v11.0.exe
        retention-days: 90
        compression-level: 0
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۴: Portable ZIP
    # ═══════════════════════════════════════════════
    - name: Create Portable ZIP
      run: |
        Compress-Archive -Path "dist/SamanehNezarat/*" `
          -DestinationPath "SamanehNezarat-Portable-v11.0.zip" `
          -CompressionLevel Optimal
        
        $zip = Get-Item "SamanehNezarat-Portable-v11.0.zip"
        $zipMB = [math]::Round($zip.Length / 1MB, 2)
        Write-Host "✅ Portable ZIP: $zipMB MB"
    
    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SamanehNezarat-Portable-v11.0
        path: SamanehNezarat-Portable-v11.0.zip
        retention-days: 30
        compression-level: 0
    
    # ═══════════════════════════════════════════════
    # مرحله ۱۵: خلاصه
    # ═══════════════════════════════════════════════
    - name: Build Summary
      run: |
        Write-Host ""
        Write-Host "════════════════════════════════════════"
        Write-Host "  🎉 Build Complete! v11.0"
        Write-Host "════════════════════════════════════════"
        Write-Host "  📦 Downloads:"
        Write-Host "  1. Setup Installer (Recommended)"
        Write-Host "  2. Portable ZIP"
        Write-Host ""
        Write-Host "  ⬇️ Actions > Artifacts"
        Write-Host "════════════════════════════════════════"
