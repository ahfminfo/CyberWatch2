name: Build سامانه نظارت v10.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-v10-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v10-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5==5.15.10 pandas openpyxl pyinstaller
    
    - name: Show file structure
      run: |
        Write-Host "📁 Repository files:"
        Get-ChildItem -Path . -File | Format-Table Name, Length
        Write-Host ""
        Write-Host "🐍 Python version:"
        python --version
        Write-Host ""
        Write-Host "📦 Installed packages:"
        pip list | Select-String -Pattern "PyQt5|pandas|openpyxl|pyinstaller"
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onedir --windowed --name "SamanehNezarat" `
          --add-data "database.py;." `
          --collect-all PyQt5 `
          --hidden-import PyQt5 `
          --hidden-import PyQt5.QtCore `
          --hidden-import PyQt5.QtGui `
          --hidden-import PyQt5.QtWidgets `
          --hidden-import pandas `
          --hidden-import openpyxl `
          --hidden-import sqlite3 `
          --hidden-import numpy `
          --hidden-import re `
          --hidden-import shutil `
          --hidden-import datetime `
          --noconfirm `
          main.py
    
    - name: Verify build
      run: |
        if (Test-Path "dist/SamanehNezarat/SamanehNezarat.exe") {
          Write-Host "════════════════════════════════════════"
          Write-Host "  ✅ Build successful!"
          Write-Host "════════════════════════════════════════"
          
          $exe = Get-Item "dist/SamanehNezarat/SamanehNezarat.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "📦 EXE Size: $sizeMB MB"
          
          $totalSize = (Get-ChildItem "dist/SamanehNezarat" -Recurse | 
                        Measure-Object -Property Length -Sum).Sum
          $totalMB = [math]::Round($totalSize / 1MB, 2)
          Write-Host "📦 Total Folder Size: $totalMB MB"
          
          $fileCount = (Get-ChildItem "dist/SamanehNezarat" -Recurse -File).Count
          Write-Host "📁 Total Files: $fileCount"
          Write-Host "════════════════════════════════════════"
        } else {
          Write-Host "❌ Build failed! EXE not found"
          Write-Host "Files in dist:"
          Get-ChildItem "dist" -Recurse | Format-Table Name, Length
          exit 1
        }
    
    - name: Create README for users
      run: |
        $readme = @"
        ================================================
        سامانه کاربران تحت نظارت در فضای مجازی
        نسخه 10.0 Enterprise Edition
        ================================================
        
        نحوه اجرا:
        ----------
        1. فایل SamanehNezarat.exe را اجرا کنید
        2. در اولین اجرا، فایل اکسل دیتابیس را انتخاب کنید
        3. برنامه آماده استفاده است
        
        ویژگی‌های نسخه 10.0:
        --------------------
        - تشخیص هوشمند رکوردهای تکراری (کد ملی، ایدی، نام)
        - تکمیل هوشمند خودکار نام‌ها
        - تقویم شمسی داخلی
        - اعتبارسنجی کد ملی ایرانی
        - Validator های تخصصی برای هر فیلد
        - وضعیت اجتماعی-اقتصادی
        - تحلیل هوشمند موضوعات (تک، مقایسه، کلی)
        - نمای مقایسه‌ای دو موضوع
        - بک‌آپ خودکار دیتابیس
        - خروجی اکسل حرفه‌ای
        - Auto-Complete در فرم‌ها
        - استخراج خودکار سال از تاریخ
        
        محدودیت‌های ورودی:
        ------------------
        - کد ملی: فقط 10 رقم عددی
        - شماره تماس: 11 رقم شروع با 0
        - نام/نام خانوادگی/نام پدر: فقط حروف فارسی
        - ایدی اینستاگرام: حروف، عدد، نقطه، آندرلاین
        - کد تارنما: عدد، حرف، / و \\
        - تعداد فالوور: فقط عدد
        - تاریخ: فرمت 1403/05/15
        
        مسیر ذخیره اطلاعات:
        -------------------
        C:\Users\<UserName>\CyberWatchData\
        
        بک‌آپ‌ها:
        --------
        C:\Users\<UserName>\CyberWatchData\backups\
        (5 بک‌آپ آخر نگه داشته می‌شود)
        
        ================================================
        "@
        $readme | Out-File -FilePath "dist/SamanehNezarat/README.txt" -Encoding UTF8
        Write-Host "✅ README created"
    
    - name: Compress output
      run: |
        Write-Host "📦 Compressing files..."
        Compress-Archive -Path "dist/SamanehNezarat/*" `
          -DestinationPath "SamanehNezarat-v10.0.zip" `
          -CompressionLevel Optimal
        
        $zip = Get-Item "SamanehNezarat-v10.0.zip"
        $zipMB = [math]::Round($zip.Length / 1MB, 2)
        Write-Host "✅ ZIP Size: $zipMB MB"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SamanehNezarat-v10.0
        path: SamanehNezarat-v10.0.zip
        retention-days: 30
        compression-level: 0
    
    - name: Build Summary
      run: |
        Write-Host ""
        Write-Host "════════════════════════════════════════"
        Write-Host "  ✅ Build Complete!"
        Write-Host "  🎯 Version: 10.0 Enterprise"
        Write-Host "════════════════════════════════════════"
        Write-Host "  📦 File: SamanehNezarat-v10.0.zip"
        Write-Host "  📅 Retention: 30 days"
        Write-Host "  ⬇️  Download from Actions > Artifacts"
        Write-Host "════════════════════════════════════════"
        Write-Host ""
        Write-Host "  ✨ New Features:"
        Write-Host "    • Duplicate detection"
        Write-Host "    • Auto-complete"
        Write-Host "    • Persian calendar"
        Write-Host "    • Family status tracking"
        Write-Host "    • Enterprise validators"
        Write-Host "════════════════════════════════════════"
